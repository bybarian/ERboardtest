# GitHub Actions Workflow to build and deploy to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Application (SPA Dist)
        run: npm run build
        env:
          NODE_ENV: production

      # If you are deploying to custom URL path or user page, the build outputs are in the 'dist' folder.
      # This step handles publishing the built static SPA to the gh-pages branch.
      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages # The branch the action will deploy to
          clean: true
